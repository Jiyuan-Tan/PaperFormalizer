<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperFormalizer</title>
<link rel="stylesheet" href="/katex/katex.min.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/"><span class="brand-mark">⊢</span><span class="txt">PaperFormalizer</span></a>
    <nav class="nav" aria-label="Pages">
      <a href="#/" data-nav="toolkit">Papers</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/" data-nav="paper" id="nav-paper" hidden></a>
    </nav>
    <span class="grow"></span>
    <span class="conn" id="conn" title="Live updates">● live</span>
    <button class="linkbtn" id="notify-btn" type="button" aria-pressed="false" title="A desktop notification when something new waits for you" hidden>Notify me</button>
    <div class="inbox-wrap">
      <button class="inbox-btn" id="inbox-btn" type="button" aria-expanded="false">Needs you <span class="count" id="inbox-count">0</span></button>
      <div class="inbox-pop" id="inbox-pop" hidden><h4>Waiting for you</h4><div id="inbox-list"></div></div>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"><p class="loading">Loading…</p></main>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Result details">
  <div class="dhead"><button class="x" id="drawer-x" type="button" aria-label="Close">✕</button><span class="pill b-neutral" id="d-kind"></span><span class="dtitle" id="d-title"></span><span class="dsub" id="d-sub"></span></div>
  <div class="dbody" id="d-body"></div>
</aside>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card"><h3 id="modal-title"></h3><div id="modal-body"></div><div class="modal-actions"><button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button><button class="btn btn-primary" id="modal-ok" type="button">Run</button></div></div>
</div>
<script src="/katex/katex.min.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
