name = "my-toolkit"
version = "0.1.0"
keywords = ["math", "theoremchecker"]
defaultTargets = ["Toolkit"]

# A TheoremChecker personal toolkit. Two libraries:
#   Toolkit  — the user's curated reusable library (Foundations, Tricks); curated by hand, never
#              written by a paper run.
#   Papers   — one module tree per verified paper; may import Toolkit and the base libraries.
# Layering (lint-enforced by TheoremChecker): Papers → Toolkit → base. Nothing imports Papers.
#
# Base libraries are read-only Lake dependencies: Mathlib, pinned, and the optional domain
# libraries between the markers below.
#
# The two executables are required by TheoremChecker (checked at the start of every `verify`
# run). Both use `TheoremCheckerIndexCore` (this toolkit's copy of the declaration-index
# extractor); they need the toolkit to be a git repository (the index records the commit):
#   paper_index    — F5 docstring coverage: indexes one paper's modules
#                    (`lake exe paper_index -- --prefix Papers.<P> --src-root <root> --modules … --out …`).
#   toolkit_index  — indexes `Toolkit.*` into `doc/toolkit_index.json`, the JSON shape retrieval
#                    searches (`lake exe toolkit_index` from the toolkit root after `lake build Toolkit`).
# A third, `candidate_scan`, reports every declaration's axioms and the constants it uses: the
# promotion round after a paper's report and `theoremchecker toolkit-health` (the toolkit graph) run it.

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Domain libraries (Causalean, FoML, optlib, …): `theoremchecker init` writes them between the
# markers from TheoremChecker's catalog (tools/data/libraries.json), each at a revision that builds
# against the mathlib `rev` below. Add one by hand the same way — always before mathlib.
# BEGIN domain libraries
# END domain libraries

# Mathlib for the toolchain in `lean-toolchain` (the catalog's `mathlib_rev`). Keep it the LAST require.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "Toolkit"
requiresModuleSystem = true

[[lean_lib]]
name = "Papers"
requiresModuleSystem = true

[[lean_lib]]
name = "TheoremCheckerIndexCore"

[[lean_exe]]
name = "paper_index"
root = "PaperIndex"
supportInterpreter = true

[[lean_exe]]
name = "toolkit_index"
root = "ToolkitIndex"
supportInterpreter = true

[[lean_exe]]
name = "candidate_scan"
root = "CandidateScan"
supportInterpreter = true
